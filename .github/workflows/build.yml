name: Build ARM64 QEMU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .ci/validate.py
      - run: python scripts/package-skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-ai-skills
          path: dist/skills/*.zip
          if-no-files-found: error

  host:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host: darwin-arm64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      JOBS: '4'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the macOS 26 toolchain
        if: matrix.host == 'darwin-arm64'
        run: |
          selected=$(python3 -c 'import glob,re; apps=glob.glob("/Applications/Xcode_26*.app"); apps.sort(key=lambda p: [int(x) for x in re.search(r"Xcode_(\d+(?:\.\d+)*)", p).group(1).split(".")]); print(apps[-1] if apps else "")')
          if [[ -n "$selected" ]]; then
            sudo xcode-select -s "$selected"
          fi
          clang --version
          xcrun --show-sdk-version
      - name: Install native build dependencies
        run: bash .ci/install-deps.sh
      - name: Compile and package native ARM64 host
        run: |
          export PATH="$PWD/out/ci-venv/bin:$PATH"
          set -o pipefail
          bash .ci/build-host.sh 2>&1 | tee out/host-build.log
      - name: Pack bootable guest systems
        run: |
          set -o pipefail
          python3 .ci/package-systems.py 2>&1 | tee out/package-systems.log
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-gki-${{ matrix.host }}
          path: dist/qemu-gki-${{ matrix.host }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: tebox-${{ matrix.host }}
          path: dist/tebox-*-${{ matrix.host }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.host == 'linux-arm64'
        with:
          name: tebox-vendor-init
          path: dist/tebox-vendor-init.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.host }}
          path: |
            out/*.log
            out/**/meson-logs/meson-log.txt
          retention-days: 7
