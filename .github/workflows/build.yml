name: Build ARM64 QEMU and Android runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .ci/validate.py
      - run: python scripts/package-skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-ai-skills
          path: dist/skills/*.zip
          if-no-files-found: error

  host:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            host: darwin-arm64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      JOBS: '4'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: bash .ci/install-deps.sh
      - name: Compile and package native ARM64 host
        run: |
          export PATH="$PWD/out/ci-venv/bin:$PATH"
          set -o pipefail
          bash .ci/build-host.sh 2>&1 | tee out/host-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-gki-${{ matrix.host }}
          path: dist/qemu-gki-${{ matrix.host }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.host }}
          path: |
            out/*.log
            out/**/meson-logs/meson-log.txt
          retention-days: 7

  android:
    needs: validate
    # Official Linux NDK tools are x86_64; all outputs in this job are Android ARM64.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          bash .ci/install-deps.sh
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross android-sdk-libsparse-utils
      - name: Setup Android SDK / cmdline-tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
      - name: Install pinned Android SDK tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;30.0.16248370' 'build-tools;36.1.0'
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
      - name: Cache checksum-verified downloads
        uses: actions/cache@v4
        with:
          path: downloads/
          key: android-inputs-${{ hashFiles('.ci/guest.lock.json') }}
      - name: Compile ARM64 guest runtime
        run: |
          export PATH="$PWD/out/ci-venv/bin:$PATH"
          set -o pipefail
          bash .ci/build-android.sh 2>&1 | tee out/android-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: gki-android-arm64
          path: dist/gki-android-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-android-arm64
          path: |
            out/*.log
            out/**/meson-logs/meson-log.txt
          retention-days: 7
