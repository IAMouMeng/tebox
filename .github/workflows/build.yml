name: Build ARM64 QEMU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .ci/validate.py
      - run: python .ci/package-skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-ai-skills
          path: dist/skills/*.zip
          if-no-files-found: error

  host:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host: darwin-arm64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      JOBS: '4'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the macOS 26 toolchain
        if: matrix.host == 'darwin-arm64'
        run: |
          selected=$(python3 -c 'import glob,re; apps=glob.glob("/Applications/Xcode_26*.app"); apps.sort(key=lambda p: [int(x) for x in re.search(r"Xcode_(\d+(?:\.\d+)*)", p).group(1).split(".")]); print(apps[-1] if apps else "")')
          if [[ -n "$selected" ]]; then
            sudo xcode-select -s "$selected"
          fi
          clang --version
          xcrun --show-sdk-version
      - name: Install native build dependencies
        run: bash .ci/install-deps.sh
      - name: Compile and package native ARM64 host
        run: |
          export PATH="$PWD/out/ci-venv/bin:$PATH"
          set -o pipefail
          bash .ci/build-host.sh 2>&1 | tee out/host-build.log
      - name: Pack bootable guest systems
        run: |
          set -o pipefail
          python3 .ci/package-systems.py 2>&1 | tee out/package-systems.log
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-gki-${{ matrix.host }}
          path: dist/qemu-gki-${{ matrix.host }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: tebox-${{ matrix.host }}
          path: dist/tebox-*-${{ matrix.host }}.tar.gz
          # main may only have thin variant metadata (no full GSI tree).
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.host == 'linux-arm64'
        with:
          name: tebox-vendor-init
          path: dist/tebox-vendor-init.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.host }}
          path: |
            out/*.log
            out/**/meson-logs/meson-log.txt
          retention-days: 7

  r1p:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      R1P_APT_MIRROR: ''
      R1P_SAVE_IMAGE: '1'
      TEBOX_VERSION: '1.0.0'
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/service/api/go.sum
      - name: Install native build dependencies
        run: bash .ci/install-deps.sh
      - name: Build tebox products image
        run: |
          mkdir -p out
          export PATH="$PWD/out/ci-venv/bin:$PATH"
          set -o pipefail
          bash .ci/build-r1p-image.sh 2>&1 | tee out/r1p-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: tebox-r1p-linux-arm64
          path: dist/tebox-r1p-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-r1p-linux-arm64
          path: out/r1p-build.log
          if-no-files-found: warn
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      NATIVE_HOST_ROOT: C:/tebox-ci/host
      SOURCE_REF: ${{ github.sha }}
      JOBS: '4'
      HOST_X86_VERSION: '1'
      HOST_CFLAGS: -march=x86-64 -mtune=generic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils patch tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-zlib
      - name: Test native launcher without a guest
        run: python3 scripts/test-native-launcher.py
      - name: Compile and verify native PE runtime
        run: bash scripts/build-native-host.sh
      - name: Package Windows host runtime
        shell: pwsh
        run: |
          $bundle = 'C:/tebox-ci/package/tebox-windows-x64'
          New-Item -ItemType Directory -Force "$bundle/host", "$bundle/scripts", 'dist' | Out-Null
          Copy-Item -Recurse 'C:/tebox-ci/host/install' "$bundle/host/install"
          Copy-Item scripts/manage-native.py, scripts/prepare-native-runtime.py, scripts/verify-native-display.ps1 "$bundle/scripts/"
          @'
          Windows x64 QEMU/VirGL host runtime; Android images are not included.
          Import an offline image export with scripts/prepare-native-runtime.py.
          Requires native Windows Python to run scripts/manage-native.py.
          CI checks PE dependencies and a paused headless VM, not Android boot or GPU display.
          '@ | Set-Content "$bundle/README.txt"
          Compress-Archive -Path $bundle -DestinationPath dist/tebox-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tebox-windows-x64
          path: dist/tebox-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows-x64
          path: |
            C:/tebox-ci/host/tools/build.log
            C:/tebox-ci/host/build/**/meson-logs/meson-log.txt
            C:/tebox-ci/host/install/smoke-test.log
          if-no-files-found: warn
          retention-days: 7
